# egress-gw static configuration. Built into the gateway image as /etc/egressgw/config.yaml ($GW_CONFIG);
# to change it, save a copy next to compose.yaml and mount it over that path (see docs/configuration.md).
initial_preset: baseline   # used only when /data/policy.yaml does not exist yet; e.g. lockdown for a strict start
log_keep_days: 30
log_max_events: 500000     # hard cap on stored events (disk-fill protection)
max_pending: 10            # at most this many approvals open at once; more are denied immediately
# policy_history_keep: 500  # policy versions kept for diff and rollback in the UI (at least 10)
# learning_ports: [80, 443]  # ports learning mode may open; only this file can change them
# learning_max_minutes: 120  # longest learning-mode session
# rule_stale_days: 30        # permanent rules that did not match for this long are offered for removal
# suggest_min_approvals: 3   # temporary approvals of one destination before a permanent rule is suggested
# suggest_window_days: 7     # ... within this many days

# Availability (docs/user-guide.md#away-mode-and-quiet-hours): while you are away (switch in the UI) or in
# quiet hours, requests that need your approval are refused at once with a message to the agent - never
# allowed automatically. What was refused is sent as one digest when you are back.
# quiet_hours: {start: "22:00", end: "07:00", days: [mon, tue, wed, thu, fri, sat, sun], tz: Europe/Berlin}
#                            # days = when a period starts; tz defaults to the gateway's TZ. The UI can change it.
# digest_minutes: 30         # while away: a digest every N minutes (0 = only when you are back)

# Hard-deny floor: CIDRs that are NEVER reachable (except service-port targets with allow_private).
# The built-in list (RFC 1918, loopback, link-local, CGNAT, multicast, ULA, NAT64/6to4/Teredo, docs
# ranges ...) always applies; entries here are ADDED to it, they cannot remove built-in ones. Only
# this read-only file can change the floor; the API/UI can only add further entries. Add your Docker
# host's public IP(s) here if it has any (e.g. a VPS), so the agent cannot reach host services via
# the egress path. An invalid entry stops the gateway.
# hard_deny_floor: [203.0.113.7/32]

# Credential injection: TLS for these exact hosts is intercepted and the header is set.
# The agent only ever holds a placeholder. Secrets are set via the control UI (stored in /data/secrets.json).
inject:
  - host: api.github.com
    header: Authorization
    value: "Bearer ${github_token}"
  - host: uploads.github.com
    header: Authorization
    value: "Bearer ${github_token}"
  - host: github.com            # git smart-HTTP (clone/fetch/push)
    header: Authorization
    value: "Basic ${b64:x-access-token:${github_token}}"

# GitHub access per repository: with a list, requests to GitHub must name one of these repositories
# (/repos/<owner>/<repo>/... on the API, /<owner>/<repo>[.git]/... for git) or they are refused before they
# reach GitHub. Empty (default): the token works for every repository it can reach. See docs/configuration.md.
# github_repos: [your-user/your-repo, your-org/*]
# github_graphql: false      # GraphQL can address any repository: refused while github_repos is set
# github_hosts: [github.com, api.github.com, uploads.github.com]   # e.g. add your GitHub Enterprise host

# Agent credentials (Authorization, Cookie) are always stripped on injection hosts, so the agent can
# never act as an account of its own choosing there - even before a secret is configured.
# inject_strip_headers: [Authorization, Cookie]

# Read-only hosts: TLS is intercepted and PUT/PATCH/DELETE are refused (blocks e.g. `npm publish`
# as an exfiltration path while installs keep working). Requires the agent to trust the gateway CA.
# An entry is a host or `*.domain` (the domain and its subdomains), or a mapping: `post_is_write: true`
# refuses POST too, except on the `read_posts` paths (glob patterns). The templates (Rules -> Templates)
# for these registries are pull-only only as long as their hosts are listed here.
readonly:
  - registry.npmjs.org           # npm publish is a PUT; POST stays allowed (npm audit is a POST)
  - registry.yarnpkg.com         # proxies npm: publishing works there too
  - host: crates.io              # cargo publish / yank / owner are PUT and DELETE
    post_is_write: true
  - host: registry-1.docker.io   # an image push starts with POST .../blobs/uploads/; pulls are GET/HEAD
    post_is_write: true
  - host: ghcr.io
    post_is_write: true
  - host: "*.quay.io"            # quay.io and its subdomains
    post_is_write: true
  - host: huggingface.co         # uploads and commits are POSTs; downloads are GET/HEAD
    post_is_write: true
    read_posts:                  # POSTs that only read
      - /api/*/paths-info/*      # file metadata (huggingface_hub, datasets)
      - "*/info/lfs/objects/batch"   # git-lfs download batch (git clone of a repo)
      - "*/git-upload-pack"      # git clone/fetch (a push is git-receive-pack)

# Service ports: fixed TCP forwards for non-HTTP protocols. The agent connects to
# egress-gw:<listen>; the connection is still subject to the policy (ask/allow/deny) for <target>.
services: []
#  - name: postgres
#    listen: 15432
#    target: db.example.org:5432
#    allow_private: false      # true = exempt this exact target from hard_deny (e.g. a LAN host)

# Grants: named, time-limited access the agent can request and you approve (docs/grants.md).
# grants_lan_allow: [192.168.1.0/24]   # LAN ranges that grants defined in the UI may reach (default: none)
# grants_never: [127.0.0.0/8, 169.254.0.0/16]   # never reachable through any grant (default: loopback,
#                                              # link-local, multicast, unspecified)
# grant_request_timeout: 300          # seconds a grant request waits for your decision
# grant_max_pending: 3                # open grant requests at once
# grant_api_rate: 30                  # requests per minute the agent may send to the grant API
# grants:
#   homeassistant:
#     description: Home Assistant REST API
#     targets:
#       - {host: ha.lan, port: 8123, scheme: http, paths: ["/api/*"], lan: true}
#     levels: [read, write]
#     approval: {read: auto, write: ask}
#     default_ttl: 1h
#     max_ttl: 4h
#   nas-ssh:
#     description: SSH to the NAS
#     targets: [{host: nas.lan, port: 22, scheme: tcp, lan: true}]
#     levels: [write]
#     default_ttl: 30m
#     max_ttl: 1h
