# egress-gw static configuration (mounted read-only at /data/config.yaml or $GW_CONFIG).
initial_preset: baseline   # used only when /data/policy.yaml does not exist yet
log_keep_days: 30

# Credential injection: TLS for these exact hosts is intercepted and the header is set.
# The agent only ever holds a placeholder. Secrets are set via the control UI (stored in /data/secrets.json).
inject:
  - host: api.github.com
    header: Authorization
    value: "Bearer ${github_token}"
  - host: uploads.github.com
    header: Authorization
    value: "Bearer ${github_token}"
  - host: github.com            # git smart-HTTP (clone/fetch/push)
    header: Authorization
    value: "Basic ${b64:x-access-token:${github_token}}"

# Service ports: fixed TCP forwards for non-HTTP protocols. The agent connects to
# egress-gw:<listen>; the connection is still subject to the policy (ask/allow/deny) for <target>.
services: []
#  - name: postgres
#    listen: 15432
#    target: db.example.org:5432
#    allow_private: false      # true = exempt this exact target from hard_deny (e.g. a LAN host)
