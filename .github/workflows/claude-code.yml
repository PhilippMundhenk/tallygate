name: Claude Code update

# Opens a PR when a newer @anthropic-ai/claude-code is on npm than the version pinned in agent/Dockerfile.
on:
  schedule:
    - cron: "17 5 * * 1"     # Mondays
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write              # fallback when Actions may not open PRs
  actions: write             # start CI for the PR branch (PRs opened with GITHUB_TOKEN trigger no workflows)

concurrency:
  group: claude-code-update
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare versions
        id: v
        run: |
          current=$(sed -n 's/^ARG CLAUDE_VERSION=//p' agent/Dockerfile)
          latest=$(npm view @anthropic-ai/claude-code version)
          echo "current=$current latest=$latest"
          [[ $latest =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected version '$latest'"; exit 1; }
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [[ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)" != "$current" ]]; then
            echo "newer=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Open PR
        if: steps.v.outputs.newer == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ steps.v.outputs.current }}
          LATEST: ${{ steps.v.outputs.latest }}
        run: |
          branch="claude-code-$LATEST"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "branch $branch exists already"; exit 0
          fi
          sed -i "s/^ARG CLAUDE_VERSION=.*/ARG CLAUDE_VERSION=$LATEST/" agent/Dockerfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "build(agent): Claude Code $CURRENT -> $LATEST"
          git push -u origin "$branch"
          body="Bumps the Claude Code version in the agent image from \`$CURRENT\` to \`$LATEST\`.

          Release notes: https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md

          After merging, cut a patch release so the published images carry the new version."
          if ! gh pr create --base main --head "$branch" --label dependencies --label agent \
               --title "build(agent): Claude Code $LATEST" --body "$body"; then
            # Repositories may forbid PRs created by GITHUB_TOKEN (Settings -> Actions -> General ->
            # "Allow GitHub Actions to create and approve pull requests"). Then ask a human to open it.
            gh issue create --label dependencies --label agent --title "Claude Code $LATEST is available" \
              --body "Branch \`$branch\` bumps the agent image from \`$CURRENT\` to \`$LATEST\`, but this workflow may not open
          pull requests here. Open one: https://github.com/${{ github.repository }}/compare/main...$branch

          (To let the workflow do it, enable *Settings -> Actions -> General -> Allow GitHub Actions to create and
          approve pull requests*.)"
          fi
          gh workflow run ci.yml --ref "$branch"
