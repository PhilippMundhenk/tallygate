name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TTYD_VERSION: "1.7.7"
  TTYD_SHA256: "8a217c968aba172e0dbf3f34447218dc015bc4d5e59bf51db2f2cd12b7be4f55"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: pip install ruff==0.16.9 shellcheck-py
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip, cache-dependency-path: "**/requirements*.txt" }
      - run: pip install -r requirements-dev.txt
      - name: Install ttyd (checksum-verified) for the web-console test
        run: |
          curl -fsSL -o /usr/local/bin/ttyd "https://github.com/tsl0922/ttyd/releases/download/${TTYD_VERSION}/ttyd.x86_64"
          echo "${TTYD_SHA256}  /usr/local/bin/ttyd" | sha256sum -c -
          chmod +x /usr/local/bin/ttyd
      - run: make test

  integration:
    # Builds all images, starts the real stack with ZERO configuration (no .env: secrets and the UI
    # password are created on first start) and runs the authoritative isolation test.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, test]
    env:
      COMPOSE_FILE: compose.yaml:compose.build.yaml
      RC_ENABLE: "0"
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
      - run: docker compose up -d
      - name: Wait for gateway health
        run: |
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' tallygate-egress-gw-1)" = healthy ] && exit 0; sleep 2
          done
          docker compose logs; exit 1
      - name: First start created the secrets and printed a UI password
        run: |
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' tallygate-agent-1)" = healthy ] && break; sleep 2
          done
          docker compose logs control | grep -q "password (shown only once)"
          docker compose exec -T control test -s /data/password-hash
          docker compose exec -T control test -s /run/tallygate/ttyd/credential
          docker compose exec -T agent test -s /run/tallygate/ttyd/credential
          ! docker compose exec -T agent test -e /run/tallygate/gw/api-token   # the agent never sees the API token
      - run: ./tests/integration/bypass.sh
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  images:
    # Multi-arch images on GHCR: :main and :sha-… from main, :X.Y.Z / :X.Y / :latest from v* tags.
    if: github.event_name != 'pull_request'
    needs: [integration]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: tallygate-gateway, context: ., file: gateway/Dockerfile }
          - { image: tallygate-control, context: control, file: control/Dockerfile }
          - { image: tallygate-agent, context: agent, file: agent/Dockerfile }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            compose.yaml
            .env.example
            config/gateway.yaml
            tests/integration/bypass.sh
          body: |
            Images: `ghcr.io/${{ github.repository_owner }}/tallygate-{gateway,control,agent}:${{ github.ref_name }}` (linux/amd64, linux/arm64).
            Install or upgrade: see the [README](https://github.com/${{ github.repository }}#quick-start) and [CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).
