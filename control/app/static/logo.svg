<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 48" fill="none" role="img" aria-label="tallygate">
  <defs>
    <linearGradient id="tgDiag" x1="7" y1="39" x2="39" y2="9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- the mark: four tally bars (also the gate's bars) crossed by a fifth, diagonal stroke -->
  <g stroke-linecap="round">
    <g stroke="#e6e6e6" stroke-width="3">
      <line x1="11" y1="10" x2="11" y2="38"/>
      <line x1="19" y1="10" x2="19" y2="38"/>
      <line x1="27" y1="10" x2="27" y2="38"/>
      <line x1="35" y1="10" x2="35" y2="38"/>
    </g>
    <line x1="7" y1="39" x2="39" y2="9" stroke="url(#tgDiag)" stroke-width="4"/>
  </g>
  <text x="58" y="33" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" letter-spacing="-0.5">
    <tspan fill="#e6e6e6">tally</tspan><tspan fill="#3b82f6">gate</tspan>
  </text>
</svg>
