# Lockdown: only Anthropic, no human-in-the-loop. Replace the policy with this (PUT /policy) in emergencies.
title: "Lockdown"
category: policy
description: "Only Claude and the Anthropic API, nothing is asked: unknown destinations are denied."
default: deny
rules:
  - {id: anthropic, action: allow, host: "*.anthropic.com", port: 443}
  - {id: claude-ai, action: allow, host: "*.claude.ai", port: 443}
