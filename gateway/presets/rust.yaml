# Rust (crates.io, rustup): Cargo's registry and downloads, and rustup toolchains.
# Apply on top of your policy in the UI (Rules -> Quick actions) or with POST /presets/rust.
title: "Rust (crates.io, rustup)"
category: template
description: "Cargo's registry and downloads, and rustup toolchains. Publishing is refused: crates.io is read-only in the gateway config."
rules:
  - {id: index, action: allow, host: "index.crates.io", port: 443}
  - {id: crates, action: allow, host: "crates.io", port: 443}
  - {id: static, action: allow, host: "static.crates.io", port: 443}
  - {id: toolchains, action: allow, host: "static.rust-lang.org", port: 443, note: rustup}
