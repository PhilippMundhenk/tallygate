# Hugging Face: Models and datasets from the Hugging Face Hub, including its download CDN.
# Apply on top of your policy in the UI (Rules -> Quick actions) or with POST /presets/huggingface.
title: "Hugging Face"
category: template
description: "Download models and datasets from the Hugging Face Hub and its CDN. Uploads and commits are refused: huggingface.co is read-only in the gateway config."
rules:
  - {id: hub, action: allow, host: "*.huggingface.co", port: 443}
  - {id: cdn, action: allow, host: "*.hf.co", port: 443}
