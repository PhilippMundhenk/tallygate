# Debian and Ubuntu packages: Debian over HTTPS only (switch the apt sources to https://; Debian images default to
# http://). Ubuntu mirrors also on port 80: not all of them serve HTTPS, and apt checks the package signatures.
# Apply on top of your policy in the UI (Rules -> Quick actions) or with POST /presets/debian.
title: "Debian and Ubuntu packages"
category: template
description: "apt mirrors for Debian (HTTPS only: switch the apt sources from http:// to https://) and Ubuntu (ports 80 and 443)."
rules:
  - {id: debian, action: allow, host: "deb.debian.org", port: 443}
  - {id: security, action: allow, host: "security.debian.org", port: 443}
  - {id: ubuntu, action: allow, host: "archive.ubuntu.com", port: [80, 443]}
  - {id: ubuntu-security, action: allow, host: "security.ubuntu.com", port: [80, 443]}
  - {id: ubuntu-ports, action: allow, host: "ports.ubuntu.com", port: [80, 443]}
